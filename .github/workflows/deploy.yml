name: CI/CD AUTO 221

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build et Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: fantaba/auto221:latest

  deploy:
    name: Déployer sur AWS EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull fantaba/auto221:latest
            sudo docker stop autoo221_api || true
            sudo docker rm autoo221_api || true
            cd ~/auto_EcoleApp
            sudo docker-compose up -d

  notify:
    name: Notification Email
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Envoyer email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD AUTO 221 - ${{ job.status }}"
          to: bintadjenga1@gmail.com
          from: bintadjenga1@gmail.com
          body: |
            Le pipeline CI/CD AUTO 221 s'est terminé.
            Status: ${{ needs.deploy.result }}
            Commit: ${{ github.sha }}
            Branche: ${{ github.ref }}
